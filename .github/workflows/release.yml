# Pushing a tag like v0.8 builds, signs and publishes that release: the APK and
# its source archives as a GitHub release, the bundle as a draft on Google
# Play's closed-testing track (see docs/RELEASING.md).
# "Run workflow" on the Actions tab is a dry run: the same signed build and
# checks, nothing published.
#
# The signing key and the Play key are secrets of the environments "release"
# and "play", which only main and v* tags can use; forks and pull requests never
# get them. The job that holds the signing key uses only GitHub's own actions,
# pinned to exact commits, and the Play job never sees that key.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CERT: 01ed3c8145a8cb8bf89959794f53bd7401e507cf6d80c0c3d2d9b6ebefaf623e # the PDF Toolbox release key
  PLAY_NOTES: store-submission/listing/en-US/release-notes.txt

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Release notes and version
        if: github.ref_type == 'tag'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "^## $VERSION" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; }
          test "$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' AndroidManifest.xml)" = "$VERSION" \
            || { echo "::error::versionName in AndroidManifest.xml isn't $VERSION"; exit 1; }
          test "$(wc -m < "$PLAY_NOTES")" -le 500 || { echo "::error::$PLAY_NOTES is over Play's 500 characters"; exit 1; }

      - name: Build tools
        # The same as the x86_64 workflow: Ubuntu's aapt2, zipalign and apksigner.
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends aapt zipalign apksigner

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.SIGNING_KEYSTORE_PASS }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASS" || { echo "::error::the signing secrets aren't set"; exit 1; }
          mkdir -p ~/.config/pdf-toolbox
          echo "$KEYSTORE_B64" | base64 -d > ~/.config/pdf-toolbox/keystore.jks
          printf '%s' "$KEYSTORE_PASS" > ~/.config/pdf-toolbox/keystore.pass

      - name: Build
        # Without a cache: a release is built from what the scripts pin (the
        # Android bits, Node, BentoPDF at its commit), fetched here.
        run: |
          ./build.sh fetch
          ./build.sh
          tools/aab.sh

      - name: Check the certificate
        # build.sh and aab.sh sign with a test key when they find no release
        # key; this stops such a build, and one signed with a wrong secret.
        run: |
          APK=build/PDFToolbox.apk
          AAB=build/PDFToolbox.aab
          apk_cert=$(apksigner verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p')
          echo "APK certificate SHA-256: $apk_cert"
          test "$apk_cert" = "$CERT" || { echo "::error::the APK isn't signed with the PDF Toolbox release key"; exit 1; }
          aab_cert=$(keytool -printcert -jarfile "$AAB" | sed -n 's/.*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
          echo "bundle certificate SHA-256: $aab_cert"
          test "$aab_cert" = "$CERT" || { echo "::error::the bundle isn't signed with the PDF Toolbox release key"; exit 1; }
          aapt2 dump badging "$APK" | sed -n 1p
          # The bundle is close to what Google Play takes (a 200 MB download).
          size=$(stat -c %s "$AAB")
          echo "bundle size: $size bytes ($((size / 1000000)) MB)"
          test "$size" -lt 200000000 || echo "::warning::the bundle is $((size / 1000000)) MB; Google Play's limit is a 200 MB download"
          sha256sum "$APK" "$AAB"

      - name: Release files
        # tools/release.sh checks the APK again (version, the key's own
        # certificate, a clean checkout, the CHANGELOG section) and makes
        # executables/release-<version>/: the APK, the two source archives,
        # SHA256SUMS and the notes.
        run: tools/release.sh

      - name: Publish on GitHub
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="executables/release-$VERSION"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "PDF Toolbox $VERSION" \
            --notes-file "$OUT/notes.md" --latest \
            "$OUT/PDFToolbox.apk" "$OUT/PDFToolbox-$VERSION-source.tar.gz" \
            "$OUT/PDFToolbox-$VERSION-third-party-sources.tar" "$OUT/SHA256SUMS"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle
          path: build/PDFToolbox.aab
          if-no-files-found: error
          retention-days: 30
          compression-level: 0 # a bundle is a zip already

      - name: Remove the key
        if: always()
        run: rm -rf ~/.config/pdf-toolbox

  play:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: play
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The bundle from the build job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name bundle --dir bundle
          ls -l bundle

      - name: Google Play (a draft on closed testing; a dry run only checks the key)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            node tools/play-upload.mjs io.github.kuscher.pdftoolbox bundle/PDFToolbox.aab "$PLAY_NOTES" --name "${GITHUB_REF_NAME#v}"
          else
            node tools/play-upload.mjs io.github.kuscher.pdftoolbox --check
          fi
