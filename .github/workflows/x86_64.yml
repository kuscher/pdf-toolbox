# BentoBook on x86_64: builds the APK on an x86_64 runner and runs the engine
# smoke test (tools/smoke.py) in Google's x86_64 Android emulator.
# Three of the five Googlebooks have Intel chips; BentoBook is developed and
# tested by hand on an Arm one. The APK has no native code, so it is the same
# file on both: this checks that it builds on an x86_64 machine and that the
# engines run on an x86_64 device. It signs with a throwaway test key; release
# APKs are signed on the maintainer's machine (tools/release.sh).
name: x86_64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'licenses/**']

permissions:
  contents: read

concurrency:
  group: x86_64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          # Android 16's x86_64 image. The Android 17 images (standard and
          # desktop) don't get through an install with the SDK's emulator 37.x
          # and software rendering: their SurfaceFlinger aborts whenever it
          # reads the screen back ("Assertion failed:
          # !rcEnc->featureInfo()->hasReadColorBufferDma"), restarting Android
          # every minute or so. BentoBook needs Android 14 or later, and what
          # this checks, the WebView and the engines on an x86_64 CPU, is the same.
          - id: android-16
            name: Android 16 (x86_64)
            # The plain AOSP image: without Google's apps and services the
            # 2-CPU runner's emulator has time left for BentoBook.
            image: system-images;android-36;default;x86_64
            channel: 0
            device: pixel_tablet
            gpu: swiftshader_indirect
            experimental: false
    continue-on-error: ${{ matrix.experimental }}
    env:
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Make room
        # The emulator needs a big data partition; the runner's preinstalled
        # toolchains BentoBook doesn't use fill most of the disk.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/lib/android/sdk/ndk /usr/share/swift
          df -h / | tail -1

      - name: Build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends aapt zipalign apksigner

      - name: Cache the toolchain and BentoPDF's build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/android
            ~/.cache/bentobook
          key: bentobook-${{ runner.arch }}-${{ hashFiles('tools/webapp.sh') }}

      - name: Build the APK
        run: |
          ./build.sh fetch
          ./build.sh

      - name: Start the emulator
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export PATH=$ANDROID_HOME/platform-tools:$PATH
          # avdmanager and the emulator must agree on where AVDs live.
          export ANDROID_AVD_HOME=$HOME/.android/avd
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin
          EMU=$ANDROID_HOME/emulator/emulator
          yes | "$SDKM/sdkmanager" --licenses > /dev/null || true
          # The Android 17 desktop images are in the SDK's dev channel (2).
          "$SDKM/sdkmanager" --channel=${{ matrix.channel }} --install emulator platform-tools "$IMAGE" > /dev/null
          "$EMU" -accel-check || true
          "$SDKM/avdmanager" list device -c > devices.txt
          DEVICE=$(grep -x '${{ matrix.device }}' devices.txt || true)
          echo "device profile: ${DEVICE:-default}"
          echo no | "$SDKM/avdmanager" create avd -n desktop -k "$IMAGE" -p "$ANDROID_AVD_HOME/desktop.avd" \
            ${DEVICE:+-d "$DEVICE"}
          # Room for a 188 MB app (the default data partition is too small for it).
          echo 'disk.dataPartition.size=6G' >> "$ANDROID_AVD_HOME/desktop.avd/config.ini"
          # A Googlebook-sized screen: the desktop profile's 3840x2160 is heavy for
          # software rendering.
          if [[ '${{ matrix.device }}' == desktop_* ]]; then
            printf 'hw.lcd.width=1920\nhw.lcd.height=1200\nhw.lcd.density=160\n' >> "$ANDROID_AVD_HOME/desktop.avd/config.ini"
          fi
          "$EMU" -list-avds
          "$EMU" -avd desktop -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics \
            -gpu ${{ matrix.gpu }} -memory 4096 > emulator.log 2>&1 &
          timeout 300 adb wait-for-device || { tail -40 emulator.log; exit 1; }
          timeout 900 bash -c 'until [[ $(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r") == 1 ]]; do sleep 5; done' ||
            { tail -40 emulator.log; exit 1; }
          adb shell getprop ro.product.cpu.abilist
          # The package manager answers a little after boot completes.
          timeout 300 bash -c 'until adb shell pm path android >/dev/null 2>&1; do sleep 5; done'
          sleep 30

      - name: Install BentoBook
        run: |
          for try in 1 2 3; do adb install -r build/BentoBook.apk && break; [[ $try == 3 ]] && exit 1; sleep 30; done
          adb shell dumpsys webviewupdate | grep -m1 "Current WebView package"

      - name: Smoke test
        # The engines that run in this image's WebView (133): Merge and OCR
        # never get their PDF.js previews up in it, and Word to PDF needs the
        # cross-origin isolation allowlist of a newer WebView. Googlebooks keep
        # WebView current (153 on the HP Googlebook 14, where all six pass).
        run: python3 tools/smoke.py --slow --timeout 900 compress pdf-to-docx pdfa

      - name: Screenshot and logs
        if: always()
        run: |
          # adb waits for a device forever when there is none.
          timeout 30 adb exec-out screencap -p > screen.png || true
          timeout 30 adb logcat -d > logcat.txt || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.id }}-emulator
          path: |
            screen.png
            logcat.txt
            emulator.log
